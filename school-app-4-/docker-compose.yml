services:
  mongodb:
    container_name: mongodb
    image: mongo:7.0 #latest version not working this Linux kernel 6.19+ compatibility check
    environment:
      MONGO_INITDB_ROOT_USERNAME: "bouriah"
      MONGO_INITDB_ROOT_PASSWORD: "Bouriah123"
      MONGO_INITDB_DATABASE: "school-app"

    ports:
      - "27017:27017"
    volumes:
      - schooldata:/data/db
volumes:
  schooldata: