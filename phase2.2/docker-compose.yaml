services:
  api:
    container_name: backend
    build: ./backend
    ports:
      - "5000:5000"
    volumes: 
      - logs:/app/logs


  client:
    container_name: frontend
    build: ./frontend
    depends_on: 
      - api
    ports:
      - "3000:3000"

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: appdb
    ports:
      - "27017:27017"


volumes: 
  logs: