services:
  mongodb:
    container_name: mongodb
    image: mongo:7.0
    environment:
      MONGODB_INITDB_ROOT_USERNAME: bouriahmongodb
      MONGODB_INITDB_ROOT_PASSWORD: Bouriah@123
      MONGO_INITDB_DATABASE: appdb
    ports:
      - "27017:27017"



