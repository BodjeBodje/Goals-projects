services:
  mysql:
    container_name: mysql-db
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Bouriah@123
      MYSQL_DATABASE: mysql-wp
      MYSQL_USER: bouriah
      MYSQL_PASSWORD: Bouriah@123
    ports:
      - "3306:3306"
    
    volumes:
      - ./mysql:/var/lib/mysql
  
  wordpress:
    depends_on:
      - mysql
    container_name: wordpress
    image: wordpress
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: bouriah
      WORDPRESS_DB_PASSWORD: Bouriah@123
      WORDPRESS_DB_NAME: mysql-wp
    ports:
      - "8080:80"
    volumes:
      - ./wordpress:/var/www/html
    
volumes:
  mysql:
  wordpress: