services:
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "5000:5000" #backend port have to expose for comunication between fron

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      # - 3000:3000
      - 3000:80
    stdin_open: true #Keeps the container's standard input (STDIN) open, even when you're not attached to the container interactively.
    tty: true #Allocates a terminal (TTY) for the container

  mongodb:
    container_name: mongodb
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: appdb
    ports:
      - "27017:27017"
